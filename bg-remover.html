<main><div class="wrap"><section><h2>Batch background remover</h2>
<p class="lead">Add photos, remove their backgrounds and download them. Everything runs in your browser and nothing is uploaded. <a href="tools/background-remover-batch.html" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i> Open full page</a></p>
<iframe id="tool" src="tools/background-remover-batch.html" title="Batch background remover" style="width:100%;height:900px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)"></iframe>
<script>
const f=document.getElementById('tool'),fit=()=>{try{f.style.height=f.contentDocument.documentElement.scrollHeight+'px'}catch(e){}};
f.addEventListener('load',()=>{fit();try{new ResizeObserver(fit).observe(f.contentDocument.body)}catch(e){}});
</script></section></div></main>
